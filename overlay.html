<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Nebula Oblitus — Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0B0E17;
    --surface:#141A2B;
    --surface-raised:#1B2338;
    --line:#2A3350;
    --text:#E8EBF5;
    --text-dim:#7C87A8;
    --pv:#E8544B;
    --etr:#F0A64B;
    --pe:#4BC8E8;
    --rm:#9B6BE8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0;
    background:transparent;
    font-family:'Space Grotesk', sans-serif;
    color:var(--text);
    width:100%; height:100%;
    overflow:hidden;
  }
  #hud{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-start;
    gap:14px;
    padding:16px;
  }
  .card{
    position:relative;
    width:300px;
    background:linear-gradient(155deg, rgba(20,26,43,0.92), rgba(11,14,23,0.92));
    border:1px solid var(--line);
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    padding:14px 16px 12px;
    backdrop-filter: blur(2px);
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:2px;
    background:linear-gradient(90deg, var(--rm), var(--pe), var(--etr), var(--pv));
    opacity:0.85;
  }
  .nome{
    font-size:16px;
    font-weight:700;
    letter-spacing:0.01em;
    margin:2px 0 10px;
    color:var(--text);
  }
  .stat{
    display:grid;
    grid-template-columns:34px 1fr 62px;
    align-items:center;
    column-gap:10px;
    margin-bottom:7px;
    position:relative;
  }
  .stat:last-child{ margin-bottom:0; }
  .chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:600;
    text-align:center;
    padding:3px 0;
    border-radius:3px;
    color:var(--void);
  }
  .chip.pv{ background:var(--pv); }
  .chip.etr{ background:var(--etr); }
  .chip.pe{ background:var(--pe); }
  .chip.rm{ background:var(--rm); }

  .track{
    position:relative;
    height:10px;
    background:var(--surface-raised);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .fill{
    position:absolute;
    top:0; left:0; bottom:0;
    width:0%;
    transition:width 0.6s cubic-bezier(.4,0,.2,1);
  }
  .fill.pv{ background:var(--pv); box-shadow:0 0 8px var(--pv); }
  .fill.etr{ background:var(--etr); box-shadow:0 0 8px var(--etr); }
  .fill.pe{ background:var(--pe); box-shadow:0 0 8px var(--pe); }
  .fill.rm{ background:var(--rm); box-shadow:0 0 8px var(--rm); }

  .track.flash{ animation:flash 0.5s ease-out; }
  @keyframes flash{
    0%{ box-shadow: inset 0 0 0 1px rgba(255,255,255,0.9); }
    100%{ box-shadow: inset 0 0 0 1px rgba(255,255,255,0); }
  }

  .valores{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    text-align:right;
    color:var(--text-dim);
    white-space:nowrap;
  }

  .delta{
    position:absolute;
    right:64px;
    top:-2px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
  }
  .delta.mostrar{
    animation: subir 1.1s ease-out forwards;
  }
  .delta.neg{ color:var(--pv); }
  .delta.pos{ color:var(--pe); }
  @keyframes subir{
    0%{ opacity:0; transform:translateY(4px); }
    15%{ opacity:1; transform:translateY(0); }
    75%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-10px); }
  }

  .offline{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
    padding:4px 16px;
  }
</style>
</head>
<body>
<div id="hud"></div>

<script>
/*
  Uso:
  overlay.html?api=URL_DO_APPS_SCRIPT&players=helena,oscar,caio&interval=2000

  api       — URL /exec do Google Apps Script (obrigatório)
  players   — lista de nomes separados por vírgula (opcional; sem isso, mostra todos)
  interval  — intervalo de atualização em ms (padrão 2000)
*/

var params = new URLSearchParams(window.location.search);
var API_URL = params.get('api');
var PLAYERS = params.get('players');
var INTERVAL = Number(params.get('interval')) || 2000;

var hud = document.getElementById('hud');
var estadoAnterior = {};

var STATS = [
  { key: 'pv', max: 'pvMax', label: 'PV' },
  { key: 'etr', max: 'etrMax', label: 'ETR' },
  { key: 'pe', max: 'peMax', label: 'PE' },
  { key: 'rm', max: 'rmMax', label: 'RM' }
];

function montarUrl() {
  if (!API_URL) return null;
  var url = API_URL + '?action=status';
  if (PLAYERS) url += '&players=' + encodeURIComponent(PLAYERS);
  return url;
}

function renderCard(p) {
  var card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-' + p.id;

  var nome = document.createElement('div');
  nome.className = 'nome';
  nome.textContent = p.nome;
  card.appendChild(nome);

  STATS.forEach(function (s) {
    var atual = p[s.key];
    var max = p[s.max] || 1;
    var pct = Math.max(0, Math.min(100, (atual / max) * 100));

    var row = document.createElement('div');
    row.className = 'stat';
    row.innerHTML =
      '<div class="chip ' + s.key + '">' + s.label + '</div>' +
      '<div class="track" id="track-' + p.id + '-' + s.key + '">' +
        '<div class="fill ' + s.key + '" id="fill-' + p.id + '-' + s.key + '" style="width:' + pct + '%"></div>' +
        '<div class="delta" id="delta-' + p.id + '-' + s.key + '"></div>' +
      '</div>' +
      '<div class="valores" id="val-' + p.id + '-' + s.key + '">' + atual + '/' + max + '</div>';
    card.appendChild(row);
  });

  return card;
}

function atualizarCard(p) {
  var anterior = estadoAnterior[p.id];

  STATS.forEach(function (s) {
    var atual = p[s.key];
    var max = p[s.max] || 1;
    var pct = Math.max(0, Math.min(100, (atual / max) * 100));

    var fill = document.getElementById('fill-' + p.id + '-' + s.key);
    var val = document.getElementById('val-' + p.id + '-' + s.key);
    var track = document.getElementById('track-' + p.id + '-' + s.key);
    var deltaEl = document.getElementById('delta-' + p.id + '-' + s.key);
    if (!fill) return;

    fill.style.width = pct + '%';
    val.textContent = atual + '/' + max;

    if (anterior && anterior[s.key] !== atual) {
      var diff = atual - anterior[s.key];
      track.classList.remove('flash');
      void track.offsetWidth;
      track.classList.add('flash');

      deltaEl.textContent = (diff > 0 ? '+' : '') + diff;
      deltaEl.className = 'delta mostrar ' + (diff < 0 ? 'neg' : 'pos');
      setTimeout(function () {
        deltaEl.classList.remove('mostrar');
      }, 1100);
    }
  });
}

function render(lista) {
  lista.forEach(function (p) {
    var existente = document.getElementById('card-' + p.id);
    if (!existente) {
      hud.appendChild(renderCard(p));
    } else {
      atualizarCard(p);
    }
    estadoAnterior[p.id] = p;
  });
}

function buscar() {
  var url = montarUrl();
  if (!url) {
    hud.innerHTML = '<div class="offline">Adicione ?api=URL_DO_APPS_SCRIPT ao endereço deste overlay.</div>';
    return;
  }
  fetch(url)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (Array.isArray(data)) render(data);
    })
    .catch(function () { /* falha silenciosa — tenta de novo no próximo ciclo */ });
}

buscar();
setInterval(buscar, INTERVAL);
</script>
</body>
</html>
