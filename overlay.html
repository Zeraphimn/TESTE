<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Nebula Oblitus — Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0B0E17;
    --surface:#12161F;
    --surface-raised:#1A2029;
    --line:#2A313D;
    --text:#EDEFF4;
    --text-dim:#7C879A;
    --pv:#E8544B;
    --etr:#F0A64B;
    --pe:#4BC8E8;
    --rm:#9B6BE8;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background:transparent;
    font-family:'Space Grotesk', sans-serif;
    color:var(--text);
    width:100%; height:100%;
    overflow:hidden;
  }
  #hud{
    display:flex;
    flex-direction:column;
    gap:18px;
    padding:20px;
  }

  .card{ width:340px; }

  .card-topo{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
    padding-left:2px;
  }
  .card-topo .marca{
    width:6px; height:6px;
    background:var(--text-dim);
    transform:rotate(45deg);
    flex-shrink:0;
  }
  .nome{
    font-size:13px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text);
    transition: text-shadow 0.4s ease, -webkit-text-stroke 0.4s ease;
  }
  .nome.pv-cheio{
    -webkit-text-stroke: 1.1px rgba(240,200,110,0.95);
  }
  .nome.pv-baixo{
    -webkit-text-stroke: 1px rgba(196,203,214,0.85);
    text-shadow: 0 0 6px rgba(196,203,214,0.4);
  }
  .nome.pv-critico{
    -webkit-text-stroke: 1px rgba(232,84,75,0.95);
    animation: pulso-nome 1.1s ease-in-out infinite;
  }
  @keyframes pulso-nome{
    0%, 100%{ text-shadow: 0 0 6px rgba(232,84,75,0.6); }
    50%{ text-shadow: 0 0 14px rgba(232,84,75,1); }
  }
  .card-topo .linha{
    flex:1;
    height:1px;
    background:linear-gradient(90deg, var(--line), transparent);
  }

  .stat{
    display:flex;
    align-items:stretch;
    gap:6px;
    margin-bottom:6px;
    height:30px;
  }
  .stat:last-child{ margin-bottom:0; }

  .icone{
    width:34px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--surface-raised);
    border:1px solid var(--line);
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.02em;
  }
  .icone.pv{ color:var(--pv); }
  .icone.etr{ color:var(--etr); }
  .icone.pe{ color:var(--pe); }
  .icone.rm{ color:var(--rm); }

  .track{
    position:relative;
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    overflow:hidden;
  }
  .fill{
    position:absolute;
    top:0; left:0; bottom:0;
    width:0%;
    transition:width 0.6s cubic-bezier(.4,0,.2,1);
  }
  .fill.pv{
    background:linear-gradient(90deg, color-mix(in srgb, var(--pv) 55%, black), var(--pv));
    animation: batimento 1.1s ease-in-out infinite;
  }
  .fill.etr{ background:linear-gradient(90deg, color-mix(in srgb, var(--etr) 55%, black), var(--etr)); }
  .fill.pe{ background:linear-gradient(90deg, color-mix(in srgb, var(--pe) 55%, black), var(--pe)); }
  .fill.rm{ background:linear-gradient(90deg, color-mix(in srgb, var(--rm) 55%, black), var(--rm)); }

  @keyframes batimento{
    0%{ filter:brightness(1); }
    8%{ filter:brightness(1.4); }
    16%{ filter:brightness(1); }
    26%{ filter:brightness(1.22); }
    36%{ filter:brightness(1); }
    100%{ filter:brightness(1); }
  }

  .fill::after{
    content:"";
    position:absolute;
    top:0; right:0; bottom:0;
    width:3px;
    background:rgba(255,255,255,0.75);
  }
  .fill::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='20' viewBox='0 0 60 20'><path d='M0 12 Q15 4 30 12 T60 12' stroke='white' stroke-opacity='0.28' stroke-width='2' fill='none'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='34' height='20' viewBox='0 0 34 20'><path d='M0 8 Q8.5 16 17 8 T34 8' stroke='white' stroke-opacity='0.4' stroke-width='1.6' fill='none'/></svg>");
    background-repeat: repeat-x, repeat-x;
    background-size: 60px 100%, 34px 100%;
    background-position: 0 0, 0 0;
    mix-blend-mode:overlay;
    animation: mover-ondas 3s linear infinite;
  }
  @keyframes mover-ondas{
    from{ background-position: 0 0, 0 0; }
    to{ background-position: -60px 0, 34px 0; }
  }

  .track.flash{ animation:flash 0.5s ease-out; }
  @keyframes flash{
    0%{ box-shadow: inset 0 0 0 30px rgba(255,255,255,0.35); }
    100%{ box-shadow: inset 0 0 0 30px rgba(255,255,255,0); }
  }

  .track.cura{ animation: flash-cura 0.7s ease-out; }
  @keyframes flash-cura{
    0%{ box-shadow: inset 0 0 0 30px rgba(75,232,140,0.6); }
    100%{ box-shadow: inset 0 0 0 30px rgba(75,232,140,0); }
  }

  .track.critico{
    animation: pulso-barra 1.2s ease-in-out infinite;
  }
  @keyframes pulso-barra{
    0%, 100%{ box-shadow: 0 0 0 rgba(232,84,75,0); border-color:var(--line); }
    50%{ box-shadow: 0 0 10px 1px rgba(232,84,75,0.65); border-color:var(--pv); }
  }

  /* ===== Corrupção visual do ETR — 7 níveis, sempre dentro da área da barra ===== */
  .track.etr::before{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.09) 0px, rgba(255,255,255,0.09) 1px, transparent 1px, transparent 3px);
    opacity:0;
    mix-blend-mode:overlay;
  }
  .track.etr::after{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    background:linear-gradient(100deg, transparent 0%, rgba(255,60,90,0.3) 18%, transparent 22%, transparent 55%, rgba(70,220,255,0.28) 60%, transparent 64%, transparent 100%);
    background-size:220% 100%;
    background-position:220% 0;
    opacity:0;
    mix-blend-mode:screen;
  }

  @keyframes etr-respiracao{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.12); } }
  @keyframes etr-flicker-leve{ 0%,100%{ opacity:0.08; } 50%{ opacity:0.16; } }
  @keyframes etr-flicker-media{ 0%{ opacity:0.14; } 20%{ opacity:0.32; } 35%{ opacity:0.12; } 55%{ opacity:0.3; } 70%{ opacity:0.1; } 100%{ opacity:0.14; } }
  @keyframes etr-flicker-forte{ 0%{ opacity:0.25; } 12%{ opacity:0.55; } 24%{ opacity:0.15; } 40%{ opacity:0.5; } 52%{ opacity:0.1; } 68%{ opacity:0.5; } 80%{ opacity:0.2; } 100%{ opacity:0.25; } }
  @keyframes etr-varredura{ from{ background-position:220% 0; } to{ background-position:-20% 0; } }
  @keyframes etr-borda-falha{ 0%,100%{ border-color:var(--line); } 50%{ border-color:var(--etr); } }
  @keyframes etr-cromatico{ 0%,100%{ filter:brightness(1.1) hue-rotate(0deg); } 50%{ filter:brightness(1.22) hue-rotate(10deg); } }

  /* Nível 1 — 0 a 20%: respiração quase imperceptível */
  .track.etr-n1 .fill{ animation: etr-respiracao 3.6s ease-in-out infinite; }

  /* Nível 2 — 21 a 40%: respiração um pouco mais perceptível */
  .track.etr-n2 .fill{ animation: etr-respiracao 2.6s ease-in-out infinite; }

  /* Nível 3 — 41 a 60%: flickering discreto começa a aparecer */
  .track.etr-n3::before{ opacity:0.12; animation: etr-flicker-leve 2s steps(6) infinite; }
  .track.etr-n3 .fill{ animation: etr-respiracao 1.9s ease-in-out infinite; }

  /* Nível 4 — 61 a 75%: glitches e interferências internas */
  .track.etr-n4::before{ opacity:0.22; animation: etr-flicker-media 1.6s steps(8) infinite; }
  .track.etr-n4::after{ opacity:0.2; animation: etr-varredura 2.4s linear infinite; }
  .track.etr-n4 .fill{ animation: etr-respiracao 1.4s ease-in-out infinite; }

  /* Nível 5 — 76 a 90%: glitches intensos + aberração cromática + falha na borda */
  .track.etr-n5{ animation: etr-borda-falha 0.6s steps(2) infinite; }
  .track.etr-n5::before{ opacity:0.32; animation: etr-flicker-media 1s steps(8) infinite; }
  .track.etr-n5::after{ opacity:0.3; animation: etr-varredura 1.5s linear infinite; }
  .track.etr-n5 .fill{ animation: etr-respiracao 1s ease-in-out infinite, etr-cromatico 1.8s linear infinite; }

  /* Nível 6 — 91 a 99%: interferências frequentes, preenchimento instável */
  .track.etr-n6{ animation: etr-borda-falha 0.35s steps(2) infinite; }
  .track.etr-n6::before{ opacity:0.44; animation: etr-flicker-forte 0.6s steps(10) infinite; }
  .track.etr-n6::after{ opacity:0.42; animation: etr-varredura 0.9s linear infinite; }
  .track.etr-n6 .fill{ animation: etr-respiracao 0.7s ease-in-out infinite, etr-cromatico 1s linear infinite; }

  /* Nível 7 — 100%: colapso visual, mas a barra nunca se desloca */
  .track.etr-n7{ animation: etr-borda-falha 0.18s steps(2) infinite; }
  .track.etr-n7::before{ opacity:0.58; animation: etr-flicker-forte 0.32s steps(12) infinite; }
  .track.etr-n7::after{ opacity:0.58; animation: etr-varredura 0.45s linear infinite; }
  .track.etr-n7 .fill{ animation: etr-respiracao 0.45s ease-in-out infinite, etr-cromatico 0.5s linear infinite; }

  /* Número do ETR também "sofre" a partir do nível 4, sem nunca sair do lugar */
  .valores .atual.etr-glitch{
    animation: num-glitch 1.3s steps(10) infinite;
  }
  @keyframes num-glitch{
    0%, 100%{ opacity:1; text-shadow:none; }
    10%{ opacity:0.85; text-shadow: 1px 0 rgba(255,60,90,0.6), -1px 0 rgba(70,220,255,0.6); }
    20%{ opacity:1; text-shadow:none; }
    55%{ opacity:0.7; text-shadow: -1px 0 rgba(255,60,90,0.5), 1px 0 rgba(70,220,255,0.5); }
    62%{ opacity:1; text-shadow:none; }
  }

  .valores{
    flex-shrink:0;
    display:flex;
    align-items:baseline;
    gap:3px;
    min-width:66px;
    justify-content:flex-end;
    font-family:'IBM Plex Mono', monospace;
  }
  .valores .atual{
    font-size:17px;
    font-weight:700;
    color:var(--text);
    transition:color 0.3s ease;
  }
  .valores .atual.critico{
    color:var(--pv);
    animation: pulso-critico 1.2s ease-in-out infinite;
  }
  @keyframes pulso-critico{
    0%, 100%{ opacity:1; }
    50%{ opacity:0.55; }
  }
  .valores .max{
    font-size:11px;
    font-weight:600;
    color:var(--text-dim);
  }

  .delta{
    position:absolute;
    left:8px;
    top:50%;
    transform:translateY(-50%);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:700;
    opacity:0;
    pointer-events:none;
    text-shadow:0 0 4px rgba(0,0,0,0.8);
  }
  .delta.mostrar{ animation: subir 1.1s ease-out forwards; }
  .delta.neg{ color:#FFFFFF; }
  .delta.pos{ color:#FFFFFF; }
  .delta.cura{ color:#4BE88C; }
  @keyframes subir{
    0%{ opacity:0; transform:translateY(-50%) translateX(-4px); }
    15%{ opacity:1; transform:translateY(-50%) translateX(0); }
    75%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-50%) translateX(6px); }
  }

  .offline{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
    padding:4px 16px;
  }
</style>
</head>
<body>
<div id="hud"></div>

<script>
/*
  Uso:
  overlay.html?api=URL_DO_APPS_SCRIPT&players=helena,oscar,caio&interval=2000

  api       — URL /exec do Google Apps Script (obrigatório)
  players   — lista de nomes separados por vírgula (opcional; sem isso, mostra todos)
  interval  — intervalo de atualização em ms (padrão 2000)
*/

var params = new URLSearchParams(window.location.search);
var API_URL = params.get('api');
var PLAYERS = params.get('players');
var INTERVAL = Number(params.get('interval')) || 2000;

var hud = document.getElementById('hud');
var estadoAnterior = {};

var STATS = [
  { key: 'pv', max: 'pvMax', label: 'PV' },
  { key: 'etr', max: 'etrMax', label: 'ETR' },
  { key: 'pe', max: 'peMax', label: 'PE' },
  { key: 'rm', max: 'rmMax', label: 'RM' }
];

// Decide se o número desse status deve ficar em destaque vermelho.
// PV: crítico quando cai a 20% (1/5) do máximo ou menos.
// ETR: crítico quando sobe a 75% do máximo ou mais.
// Ajuste os números abaixo se quiser outros limites.
function ehCritico(key, pct) {
  if (key === 'pv') return pct <= 20;
  if (key === 'etr') return pct >= 75;
  return false;
}

// Decide a borda do nome do personagem com base na % de PV.
// 100% = dourada · abaixo de 100% = prata · abaixo de 25% = vermelha pulsando.
function classeNome(p) {
  var max = p.pvMax || 1;
  var pct = Math.max(0, Math.min(100, (p.pv / max) * 100));
  if (pct < 25) return 'pv-critico';
  if (pct >= 100) return 'pv-cheio';
  return 'pv-baixo';
}

// Calcula o nível de corrupção visual do ETR (1 a 7) com base na % do máximo.
// 0–20% n1 · 21–40% n2 · 41–60% n3 · 61–75% n4 · 76–90% n5 · 91–99% n6 · 100% n7
function nivelEtr(pct) {
  if (pct <= 20) return 1;
  if (pct <= 40) return 2;
  if (pct <= 60) return 3;
  if (pct <= 75) return 4;
  if (pct <= 90) return 5;
  if (pct <= 99) return 6;
  return 7;
}

function montarUrl() {
  if (!API_URL) return null;
  var url = API_URL + '?action=status';
  if (PLAYERS) url += '&players=' + encodeURIComponent(PLAYERS);
  return url;
}

function renderCard(p) {
  var card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-' + p.id;

  var topo = document.createElement('div');
  topo.className = 'card-topo';
  topo.innerHTML = '<div class="marca"></div><div class="nome ' + classeNome(p) + '" id="nome-' + p.id + '">' + p.nome + '</div><div class="linha"></div>';
  card.appendChild(topo);

  STATS.forEach(function (s) {
    var atual = p[s.key];
    var max = p[s.max] || 1;
    var pct = Math.max(0, Math.min(100, (atual / max) * 100));
    var classeCritico = ehCritico(s.key, pct) ? ' critico' : '';
    var classeEtr = s.key === 'etr' ? (' etr-n' + nivelEtr(pct)) : '';
    var classeGlitchNum = (s.key === 'etr' && nivelEtr(pct) >= 4) ? ' etr-glitch' : '';

    var row = document.createElement('div');
    row.className = 'stat';
    row.innerHTML =
      '<div class="icone ' + s.key + '">' + s.label + '</div>' +
      '<div class="track' + classeCritico + classeEtr + '" id="track-' + p.id + '-' + s.key + '">' +
        '<div class="fill ' + s.key + '" id="fill-' + p.id + '-' + s.key + '" style="width:' + pct + '%"></div>' +
        '<div class="delta" id="delta-' + p.id + '-' + s.key + '"></div>' +
      '</div>' +
      '<div class="valores">' +
        '<span class="atual' + classeCritico + classeGlitchNum + '" id="val-' + p.id + '-' + s.key + '">' + atual + '</span>' +
        '<span class="max">/' + max + '</span>' +
      '</div>';
    card.appendChild(row);
  });

  return card;
}

function atualizarCard(p) {
  var anterior = estadoAnterior[p.id];

  var nomeEl = document.getElementById('nome-' + p.id);
  if (nomeEl) {
    nomeEl.className = 'nome ' + classeNome(p);
  }

  STATS.forEach(function (s) {
    var atual = p[s.key];
    var max = p[s.max] || 1;
    var pct = Math.max(0, Math.min(100, (atual / max) * 100));

    var fill = document.getElementById('fill-' + p.id + '-' + s.key);
    var val = document.getElementById('val-' + p.id + '-' + s.key);
    var track = document.getElementById('track-' + p.id + '-' + s.key);
    var deltaEl = document.getElementById('delta-' + p.id + '-' + s.key);
    if (!fill) return;

    fill.style.width = pct + '%';
    val.textContent = atual;
    val.classList.toggle('critico', ehCritico(s.key, pct));
    track.classList.toggle('critico', ehCritico(s.key, pct));

    if (s.key === 'etr') {
      track.className = track.className.replace(/\betr-n\d\b/g, '').trim();
      track.classList.add('etr-n' + nivelEtr(pct));
      val.classList.toggle('etr-glitch', nivelEtr(pct) >= 4);
    }

    if (anterior && anterior[s.key] !== atual) {
      var diff = atual - anterior[s.key];
      var ehCura = (s.key === 'pv' && diff > 0);

      track.classList.remove('flash', 'cura');
      void track.offsetWidth;
      track.classList.add(ehCura ? 'cura' : 'flash');

      deltaEl.textContent = (diff > 0 ? '+' : '') + diff;
      deltaEl.className = 'delta mostrar ' + (ehCura ? 'cura' : (diff < 0 ? 'neg' : 'pos'));
      setTimeout(function () {
        deltaEl.classList.remove('mostrar');
      }, 1100);
    }
  });
}

function render(lista) {
  lista.forEach(function (p) {
    var existente = document.getElementById('card-' + p.id);
    if (!existente) {
      hud.appendChild(renderCard(p));
    } else {
      atualizarCard(p);
    }
    estadoAnterior[p.id] = p;
  });
}

function buscar() {
  var url = montarUrl();
  if (!url) {
    hud.innerHTML = '<div class="offline">Adicione ?api=URL_DO_APPS_SCRIPT ao endereço deste overlay.</div>';
    return;
  }
  fetch(url)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (Array.isArray(data)) render(data);
    })
    .catch(function () { /* falha silenciosa — tenta de novo no próximo ciclo */ });
}

buscar();
setInterval(buscar, INTERVAL);
</script>
</body>
</html>
