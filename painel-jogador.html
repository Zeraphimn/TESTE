<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Nebula Oblitus — Painel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0B0E17;
    --surface:#141A2B;
    --surface-raised:#1B2338;
    --line:#2A3350;
    --text:#E8EBF5;
    --text-dim:#7C87A8;
    --pv:#E8544B;
    --etr:#F0A64B;
    --pe:#4BC8E8;
    --rm:#9B6BE8;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0;
    background:var(--void);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    min-height:100%;
  }
  body{
    padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
    max-width:480px;
    margin:0 auto;
  }
  header{
    margin-bottom:22px;
  }
  .rotulo{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:0.04em;
  }
  h1{
    font-size:26px;
    font-weight:700;
    margin:4px 0 0;
  }
  .status-conexao{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    margin-top:8px;
    color:var(--text-dim);
  }
  .status-conexao.ok{ color:var(--pe); }
  .status-conexao.erro{ color:var(--pv); }

  .stat-card{
    background:var(--surface);
    border:1px solid var(--line);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    padding:16px;
    margin-bottom:14px;
  }
  .stat-topo{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:12px;
  }
  .stat-nome{
    font-weight:700;
    font-size:15px;
  }
  .stat-nome.pv{ color:var(--pv); }
  .stat-nome.etr{ color:var(--etr); }
  .stat-nome.pe{ color:var(--pe); }
  .stat-nome.rm{ color:var(--rm); }

  .stat-max{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--text-dim);
  }

  .track{
    height:8px;
    background:var(--surface-raised);
    border:1px solid var(--line);
    margin-bottom:14px;
    overflow:hidden;
  }
  .fill{
    height:100%;
    width:0%;
    transition:width 0.4s ease;
  }
  .fill.pv{ background:var(--pv); }
  .fill.etr{ background:var(--etr); }
  .fill.pe{ background:var(--pe); }
  .fill.rm{ background:var(--rm); }

  .controles{
    display:grid;
    grid-template-columns:52px 1fr 52px;
    gap:10px;
    align-items:center;
  }
  button.passo{
    height:52px;
    border:1px solid var(--line);
    background:var(--surface-raised);
    color:var(--text);
    font-size:22px;
    font-weight:600;
    border-radius:4px;
  }
  button.passo:active{ background:var(--line); }

  input.valor{
    width:100%;
    height:52px;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:20px;
    font-weight:600;
    background:var(--surface-raised);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:4px;
  }
  input.valor:focus{ outline:2px solid var(--text-dim); }

  .rodape{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--text-dim);
    margin-top:18px;
    line-height:1.6;
  }
  .aviso{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--pv);
    padding:14px 0;
  }
</style>
</head>
<body>

<header>
  <div class="rotulo">Nebula Oblitus — painel de status</div>
  <h1 id="nomePersonagem">Carregando…</h1>
  <div class="status-conexao" id="statusConexao">conectando…</div>
</header>

<div id="stats"></div>

<div class="rodape">
  Toque em − ou + para ajustar, ou digite o valor e pressione Enter.<br>
  As mudanças aparecem na transmissão em poucos segundos.
</div>

<script>
/*
  Uso:
  painel-jogador.html?api=URL_DO_APPS_SCRIPT&id=001&token=SEU_TOKEN

  api    — URL /exec do Google Apps Script (obrigatório)
  id     — ID do personagem na planilha (obrigatório)
  token  — token individual do personagem, definido na planilha (obrigatório)
*/

var params = new URLSearchParams(window.location.search);
var API_URL = params.get('api');
var ID = params.get('id');
var TOKEN = params.get('token');

var STATS = [
  { key: 'pv', max: 'pvMax', label: 'PV — Pontos de Vida' },
  { key: 'etr', max: 'etrMax', label: 'ETR — Estresse' },
  { key: 'pe', max: 'peMax', label: 'PE — Pontos de Energia' },
  { key: 'rm', max: 'rmMax', label: 'RM — Reserva de Mana' }
];

var statusConexao = document.getElementById('statusConexao');
var statsDiv = document.getElementById('stats');
var estadoAtual = null;
var pendente = {};

function checarConfig() {
  if (!API_URL || !ID || !TOKEN) {
    document.getElementById('nomePersonagem').textContent = 'Configuração incompleta';
    statsDiv.innerHTML = '<div class="aviso">Este link precisa de ?api=…&id=…&token=… na URL. Peça o link correto ao Mestre.</div>';
    return false;
  }
  return true;
}

function montarStatusUrl() {
  return API_URL + '?action=status&id=' + encodeURIComponent(ID);
}

function montarUpdateUrl(campo, valor) {
  return API_URL + '?action=update&id=' + encodeURIComponent(ID) +
    '&token=' + encodeURIComponent(TOKEN) +
    '&campo=' + campo + '&valor=' + valor;
}

function renderStats(p) {
  document.getElementById('nomePersonagem').textContent = p.nome;
  statsDiv.innerHTML = '';

  STATS.forEach(function (s) {
    var atual = p[s.key];
    var max = p[s.max] || 1;
    var pct = Math.max(0, Math.min(100, (atual / max) * 100));

    var card = document.createElement('div');
    card.className = 'stat-card';
    card.innerHTML =
      '<div class="stat-topo">' +
        '<div class="stat-nome ' + s.key + '">' + s.label + '</div>' +
        '<div class="stat-max">máx ' + max + '</div>' +
      '</div>' +
      '<div class="track"><div class="fill ' + s.key + '" id="fill-' + s.key + '" style="width:' + pct + '%"></div></div>' +
      '<div class="controles">' +
        '<button class="passo" data-campo="' + s.key + '" data-delta="-1">−</button>' +
        '<input class="valor" id="input-' + s.key + '" inputmode="numeric" value="' + atual + '">' +
        '<button class="passo" data-campo="' + s.key + '" data-delta="1">+</button>' +
      '</div>';
    statsDiv.appendChild(card);
  });

  statsDiv.querySelectorAll('button.passo').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var campo = btn.getAttribute('data-campo');
      var delta = Number(btn.getAttribute('data-delta'));
      var input = document.getElementById('input-' + campo);
      var novoValor = Number(input.value) + delta;
      if (novoValor < 0) novoValor = 0;
      input.value = novoValor;
      enviarAtualizacao(campo, novoValor);
    });
  });

  STATS.forEach(function (s) {
    var input = document.getElementById('input-' + s.key);
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') {
        input.blur();
        enviarAtualizacao(s.key, Number(input.value));
      }
    });
    input.addEventListener('blur', function () {
      enviarAtualizacao(s.key, Number(input.value));
    });
  });
}

function atualizarBarra(campo, atual, max) {
  var fill = document.getElementById('fill-' + campo);
  if (!fill) return;
  var pct = Math.max(0, Math.min(100, (atual / max) * 100));
  fill.style.width = pct + '%';
}

function enviarAtualizacao(campo, valor) {
  if (isNaN(valor)) return;
  statusConexao.textContent = 'enviando…';
  statusConexao.className = 'status-conexao';

  fetch(montarUpdateUrl(campo, valor))
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.erro) {
        statusConexao.textContent = 'erro: ' + data.erro;
        statusConexao.className = 'status-conexao erro';
        return;
      }
      estadoAtual = data;
      var maxKey = STATS.filter(function (s) { return s.key === campo; })[0].max;
      atualizarBarra(campo, data[campo], data[maxKey]);
      var input = document.getElementById('input-' + campo);
      if (input && document.activeElement !== input) input.value = data[campo];
      statusConexao.textContent = 'sincronizado';
      statusConexao.className = 'status-conexao ok';
    })
    .catch(function () {
      statusConexao.textContent = 'sem conexão — tentando de novo';
      statusConexao.className = 'status-conexao erro';
    });
}

function carregar() {
  fetch(montarStatusUrl())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.erro) {
        document.getElementById('nomePersonagem').textContent = 'Erro';
        statsDiv.innerHTML = '<div class="aviso">' + data.erro + '</div>';
        return;
      }
      estadoAtual = data;
      renderStats(data);
      statusConexao.textContent = 'sincronizado';
      statusConexao.className = 'status-conexao ok';
    })
    .catch(function () {
      statusConexao.textContent = 'não foi possível conectar à API';
      statusConexao.className = 'status-conexao erro';
    });
}

if (checarConfig()) {
  carregar();
}
</script>
</body>
</html>
